# Step 10: The endgame

```csharp
public class Endgame : MonoBehaviour
{
    public GameObject floor;

    void Update()
    {
        bool done = true;
        foreach (Transform child in transform)
        {
            Knockable domino = child.gameObject.GetComponent<Knockable>();
            if (domino != null && domino.IsStandingUp())
            {
                done = false;
            }
        }

        if (done)
        {
            floor.transform.localScale = Vector3.zero;
            Invoke(nameof(Shutdown), 3.0f);
        }
    }
}
```

| Concept    | Meaning                                    |
|------------|--------------------------------------------|
| Scene      | A container of GameObjects                 |
| GameObject | An entity that does nothing by itself, but extended by Components |
| Component  | Data and behavior attached to a GameObject |
| Prefab     | A reusable GameObject template             |
| Script     | Dynamically control game state             |

<script>
// Markdeep renders asynchronously and gives no completion event, so poll for its output.
(function () {
  let tries = 0;
  const timer = setInterval(() => {
    const root = document.querySelector('.md');
    const slides = root ? root.querySelectorAll('section.h1-section') : [];
    if (slides.length || ++tries > 200) {
      clearInterval(timer);
      if (slides.length) build(root, Array.from(slides));
    }
  }, 50);

  function build(root, slides) {
    slides[0].classList.add('title');

    // Markdeep emits whitespace-only paragraphs that would add stray vertical gaps.
    root.querySelectorAll('p').forEach(p => {
      if (!p.textContent.trim() && !p.children.length) p.remove();
    });

    // Markdeep sizes diagrams with fixed width/height; a viewBox lets CSS scale them.
    root.querySelectorAll('svg.diagram').forEach(svg => {
      const w = svg.getAttribute('width'), h = svg.getAttribute('height');
      if (w && h && !svg.hasAttribute('viewBox')) {
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.removeAttribute('width');
        svg.removeAttribute('height');
      }
    });

    // Markdeep links each image to its file; a click should advance the slide, not open a tab.
    root.querySelectorAll('a > img.markdeep').forEach(img => img.parentNode.replaceWith(img));

    const count = document.createElement('div');
    count.className = 'slide-count';
    root.appendChild(count);

    function fit() {
      const s = Math.min(innerWidth / 1280, innerHeight / 720);
      document.documentElement.style.setProperty('--scale', s);
    }
    addEventListener('resize', fit);
    fit();

    const titleOf = s => s.querySelector('h1').textContent;
    const deckTitle = titleOf(slides[0]);

    let i = 0;
    function show(n) {
      i = Math.min(Math.max(n, 0), slides.length - 1);
      slides.forEach((s, k) => s.classList.toggle('active', k === i));
      count.textContent = (i + 1) + ' / ' + slides.length;
      history.replaceState(null, '', '#' + (i + 1));
      syncPresenter();
    }

    // Presenter window. A blank popup inherits this page's origin, so this page can write
    // into it directly. That works from file://, where messaging between pages often fails.
    let pw = null, start = 0, clockTimer = 0;
    const presenterHtml = `<!doctype html><meta charset="utf-8"><title>Presenter: ${deckTitle}</title>
<style>
body { font: 24px/1.45 system-ui, "Segoe UI", Helvetica, Arial, sans-serif; color: #1a1a1a; margin: 0; padding: 20px 32px; }
header { display: flex; justify-content: space-between; gap: 24px; font-size: 18px; color: #666;
         border-bottom: 2px solid #9000e0; padding-bottom: 8px; margin-bottom: 16px; }
#cur { color: #9000e0; font-weight: 700; }
#clock { font-variant-numeric: tabular-nums; cursor: pointer; }
#next { font-size: 18px; color: #666; margin-bottom: 20px; }
strong, b, a { color: #9000e0; }
code { font-family: Consolas, Menlo, monospace; background: #f5f5f5; padding: 0 .25em; }
</style>
<header><span><span id="pos"></span> <span id="cur"></span></span><span id="clock" title="Click to reset"></span></header>
<div id="next"></div><div id="notes"></div>`;

    function tick() {
      const sec = Math.floor((Date.now() - start) / 1000);
      pw.document.getElementById('clock').textContent =
        Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    function openPresenter() {
      if (!pw || pw.closed) {
        pw = open('', 'presenter', 'width=900,height=650');
        if (!pw) return;  // Popup blocked.
        // document.open replaces any stale content and listeners left from a previous page load.
        pw.document.open();
        pw.document.write(presenterHtml);
        pw.document.close();
        pw.document.addEventListener('keydown', onKey);
        pw.document.getElementById('clock').addEventListener('click', () => { start = Date.now(); tick(); });
        start = Date.now();
        clearInterval(clockTimer);
        clockTimer = setInterval(() => pw.closed ? clearInterval(clockTimer) : tick(), 1000);
        tick();
      }
      pw.focus();
      syncPresenter();
    }

    function syncPresenter() {
      if (!pw || pw.closed) return;
      const d = pw.document, notes = slides[i].querySelector('.notes');
      d.getElementById('pos').textContent = (i + 1) + ' / ' + slides.length;
      d.getElementById('cur').textContent = titleOf(slides[i]);
      d.getElementById('next').textContent = 'Next: ' + (slides[i + 1] ? titleOf(slides[i + 1]) : 'end');
      d.getElementById('notes').innerHTML = notes ? notes.innerHTML : '<em>No notes.</em>';
    }

    function onKey(e) {
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) show(i + 1);
      else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) show(i - 1);
      else if (e.key === 'Home') show(0);
      else if (e.key === 'End') show(slides.length - 1);
      else if (e.key === 'p' || e.key === 'P') openPresenter();
      else return;
      e.preventDefault();
    }

    show((parseInt(location.hash.slice(1), 10) || 1) - 1);
    document.addEventListener('keydown', onKey);
    document.addEventListener('click', e => { if (!e.target.closest('a')) show(i + 1); });  }
})();
</script>
